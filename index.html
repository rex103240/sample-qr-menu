<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Digital Menu</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet" />
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- PapaParse for Google Sheets CSV -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
            serif: ['"Playfair Display"', 'Georgia', 'serif'],
          }
        }
      }
    }
  </script>

  <style>
    /* iOS Safe Area Support */
    body {
      padding-top: env(safe-area-inset-top);
      padding-bottom: max(2rem, env(safe-area-inset-bottom));
      -webkit-tap-highlight-color: transparent;
      -webkit-font-smoothing: antialiased;
    }

    /* Smooth horizontal category pill scrolling */
    .category-scroll {
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .category-scroll::-webkit-scrollbar {
      display: none;
    }

    /* Active category pill animation */
    .cat-btn {
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .cat-btn.active {
      background-color: #1c1917;
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
    }
    .cat-btn:not(.active) {
      background-color: #f5f5f4;
      color: #57534e;
    }
    .cat-btn:not(.active):active {
      background-color: #e7e5e4;
      transform: scale(0.96);
    }

    /* Dotted leader between name and price for elegant mobile readability */
    .dish-dots {
      flex: 1;
      border-bottom: 1.5px dotted #e7e5e4;
      margin: 0 0.5rem 0.35rem 0.5rem;
      min-width: 1rem;
    }
  </style>
</head>
<body class="bg-[#faf9f6] text-stone-900 font-sans min-h-screen">

  <!-- ================= RESTAURANT CONFIGURATION ================= -->
  <script>
    // 1. Google Sheets CSV or Apps Script link:
    const GOOGLE_SHEET_CSV_URL = "https://script.google.com/macros/s/AKfycbzZSCD66MCojtpZc3Rzx4xTpMwx3GC_0faHTMRr2xc6tC8SvYBiQm2RNWj4JlyxQAjb/exec"; 

    // 2. Branding & Social Links:
    const RESTAURANT_NAME = "The Urban Fork";
    const RESTAURANT_TAGLINE = "Artisanal Kitchen & Bar";
    const CURRENCY_SYMBOL = "₹";
    
    // Social & Review Links (leave empty string "" if not using)
    const INSTAGRAM_URL = "https://instagram.com/yourhandle";
    const INSTAGRAM_HANDLE = "@theurbanfork";
    const GOOGLE_REVIEW_URL = "https://g.page/r/your-review-link/review";
  </script>
  <!-- ============================================================ -->

  <!-- Sticky Mobile Header -->
  <header class="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-stone-200/80 transition-shadow">
    <!-- Brand Info -->
    <div class="px-5 pt-3.5 pb-2.5 flex items-center justify-between">
      <div>
        <h1 id="restaurantName" class="font-serif text-xl font-bold tracking-tight text-stone-900">
          The Urban Fork
        </h1>
        <p id="restaurantTagline" class="text-[11px] text-stone-500 font-medium tracking-wide">
          Artisanal Kitchen & Bar
        </p>
      </div>

      <!-- Optional Table indicator (activated if URL has ?table=5) -->
      <div id="tableBadge" class="hidden flex items-center gap-1.5 px-3 py-1 rounded-full bg-stone-100 border border-stone-200">
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
        <span class="text-xs font-semibold text-stone-700">Table <span id="tableNumber"></span></span>
      </div>
    </div>

    <!-- Category Pills Bar (Touch Scrollable) -->
    <nav class="border-t border-stone-100/90 py-2">
      <div id="categoryTabs" class="category-scroll flex items-center gap-2 px-4 overflow-x-auto whitespace-nowrap">
        <!-- Rendered dynamically -->
        <span class="text-xs text-stone-400 py-1">Loading categories...</span>
      </div>
    </nav>
  </header>

  <!-- Menu Content -->
  <main class="max-w-xl mx-auto px-4 pt-3">
    <!-- Loading Spinner -->
    <div id="loadingIndicator" class="text-center py-20">
      <div class="inline-block w-7 h-7 border-2 border-stone-300 border-t-stone-900 rounded-full animate-spin"></div>
      <p class="text-xs text-stone-400 mt-3 font-medium">Loading menu...</p>
    </div>

    <!-- Sections container -->
    <div id="menuContainer" class="space-y-6">
      <!-- Injected via JavaScript -->
    </div>
  </main>

  <footer class="max-w-xl mx-auto px-4 mt-12 pb-12 text-center">
    <!-- Google Review Card -->
    <div id="reviewCard" class="bg-white rounded-2xl p-5 border border-stone-200/90 shadow-xs mb-6 text-center">
      <div class="flex items-center justify-center gap-1 mb-1.5 text-amber-400">

        </svg>
        Rate & Review on Google

    <!-- Social Handle -->
    <div id="socialContainer" class="flex flex-col items-center justify-center gap-2 mb-6">
      <a
        id="instagramLink"
        href="#"
        target="_blank"
        rel="noopener noreferrer"
        class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-stone-100 hover:bg-stone-200 border border-stone-200 text-stone-700 text-xs font-medium transition-colors"
      >
        <svg class="w-3.5 h-3.5 text-pink-600 fill-current" viewBox="0 0 24 24">
          <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>

        <span id="instagramHandleText">@theurbanfork</span>

    <p class="font-serif italic text-stone-500 text-xs">Thank you for dining with us</p>
    <p class="text-[10px] text-stone-400 mt-1">Please inform your server of any allergies</p>

  <script>
    // Fallback menu data
    const DEFAULT_MENU_DATA = [
      { Category: "Starters", Name: "Paneer Tikka", Description: "Cottage cheese marinated in yogurt and spices grilled to perfection", Price: "260", Badge: "Bestseller" },
      { Category: "Starters", Name: "Crispy Corn Pepper Salt", Description: "Crispy sweet corn tossed with bell peppers and black pepper", Price: "210", Badge: "" },
      { Category: "Starters", Name: "Chicken Tikka", Description: "Succulent boneless chicken chunks marinated in tandoori spices", Price: "320", Badge: "Chef's Special" },
      { Category: "Starters", Name: "Mutton Seekh Kebab", Description: "Minced spiced mutton skewers roasted in clay oven", Price: "380", Badge: "" },
      { Category: "Mains", Name: "Paneer Butter Masala", Description: "Cottage cheese cubes in a rich tomato and butter gravy", Price: "310", Badge: "" },
      { Category: "Mains", Name: "Dal Makhani", Description: "Black lentils slow cooked overnight with butter and cream", Price: "280", Badge: "Bestseller" },
      { Category: "Mains", Name: "Butter Chicken", Description: "Classic tandoori chicken cooked in mildly sweet tomato satin gravy", Price: "360", Badge: "Must Try" },
      { Category: "Mains", Name: "Mutton Rogan Josh", Description: "Traditional Kashmiri style slow cooked tender mutton curry", Price: "420", Badge: "" },
      { Category: "Breads", Name: "Butter Naan", Description: "Leavened tandoor-baked flatbread brushed with butter", Price: "60", Badge: "" },
      { Category: "Breads", Name: "Garlic Naan", Description: "Flatbread topped with minced garlic and coriander", Price: "75", Badge: "" },
      { Category: "Breads", Name: "Tandoori Roti", Description: "Whole wheat unleavened bread baked in tandoor", Price: "35", Badge: "" },
      { Category: "Breads", Name: "Laccha Paratha", Description: "Multi-layered flaky whole wheat bread", Price: "55", Badge: "" },
      { Category: "Beverages", Name: "Fresh Lime Soda", Description: "Refreshing lime juice with choice of sweet or salted soda", Price: "90", Badge: "" },
      { Category: "Beverages", Name: "Cold Coffee with Ice Cream", Description: "Rich blended espresso topped with vanilla ice cream", Price: "150", Badge: "Bestseller" },
      { Category: "Beverages", Name: "Mango Mint Cooler", Description: "Seasonal mango pulp infused with crushed mint and fizz", Price: "140", Badge: "" },
      { Category: "Desserts", Name: "Gulab Jamun (2 Pcs)", Description: "Warm cottage cheese dumplings soaked in saffron sugar syrup", Price: "110", Badge: "" },
      { Category: "Desserts", Name: "Sizzling Brownie with Ice Cream", Description: "Warm walnut brownie served on a hot sizzler plate with vanilla ice cream", Price: "190", Badge: "Must Try" }
    ];

    let allMenuItems = [];

    // Initialize Header
    document.getElementById("restaurantName").innerText = RESTAURANT_NAME;
    document.getElementById("restaurantTagline").innerText = RESTAURANT_TAGLINE;

    // Initialize Google Review & Social Links
    if (GOOGLE_REVIEW_URL && GOOGLE_REVIEW_URL.trim() !== "") {
      document.getElementById("googleReviewBtn").href = GOOGLE_REVIEW_URL;
    } else {
      document.getElementById("reviewCard").classList.add("hidden");
    }

    if (INSTAGRAM_URL && INSTAGRAM_URL.trim() !== "") {
      document.getElementById("instagramLink").href = INSTAGRAM_URL;
      document.getElementById("instagramHandleText").innerText = INSTAGRAM_HANDLE || "Follow us on Instagram";
    } else {
      document.getElementById("socialContainer").classList.add("hidden");
    }

    // Detect Table Number from URL query parameter (e.g. ?table=04)
    const urlParams = new URLSearchParams(window.location.search);
    const tableParam = urlParams.get('table');
    if (tableParam) {
      document.getElementById('tableNumber').innerText = tableParam;
      document.getElementById('tableBadge').classList.remove('hidden');
    }

    // Load menu data (supports both instant Google Apps Script JSON and published CSV)
    async function loadMenu() {
      if (GOOGLE_SHEET_CSV_URL && GOOGLE_SHEET_CSV_URL.trim() !== "") {
        try {
          const cacheBusted = GOOGLE_SHEET_CSV_URL + (GOOGLE_SHEET_CSV_URL.includes("?") ? "&" : "?") + `_t=${Date.now()}`;
          const res = await fetch(cacheBusted);
          const rawText = await res.text();
          
          // Check if response is JSON (from Google Apps Script for instant updates)
          try {
            const jsonData = JSON.parse(rawText);
            if (Array.isArray(jsonData)) {
              allMenuItems = jsonData.filter(r => r.Name && String(r.Name).trim() !== "");
              renderMenu(allMenuItems);
              return;
            }
          } catch (jsonErr) {
            // Not JSON, proceed with CSV parsing
          }

          Papa.parse(rawText, {
            header: true,
            skipEmptyLines: true,
            complete: function(results) {
              const cleaned = results.data.filter(r => r.Name && r.Name.trim() !== "");
              allMenuItems = cleaned.length > 0 ? cleaned : DEFAULT_MENU_DATA;
              renderMenu(allMenuItems);
            },
            error: function() {
              renderMenu(DEFAULT_MENU_DATA);
            }
          });
          return;
        } catch (e) {
          console.warn("Falling back to local data:", e);
        }
      }

      // Try local menu.csv
      try {
        const localRes = await fetch("menu.csv");
        if (localRes.ok) {
          const csvText = await localRes.text();
          Papa.parse(csvText, {
            header: true,
            skipEmptyLines: true,
            complete: function(results) {
              const cleaned = results.data.filter(r => r.Name && r.Name.trim() !== "");
              allMenuItems = cleaned.length > 0 ? cleaned : DEFAULT_MENU_DATA;
              renderMenu(allMenuItems);
            }
          });
          return;
        }
      } catch (err) {}

      // Default fallback
      allMenuItems = DEFAULT_MENU_DATA;
      renderMenu(allMenuItems);
    }

    function escapeId(str) {
      return str.toLowerCase().replace(/[^a-z0-9]/g, "-");
    }

    function renderMenu(items) {
      document.getElementById("loadingIndicator").classList.add("hidden");

      // Extract distinct categories
      const categories = [...new Set(items.map(i => i.Category ? i.Category.trim() : "").filter(Boolean))];

      // Build Category Tabs
      const tabsContainer = document.getElementById("categoryTabs");
      tabsContainer.innerHTML = "";

      categories.forEach((cat, index) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.setAttribute("data-cat", escapeId(cat));
        btn.className = `cat-btn px-4 py-1.5 rounded-full text-xs font-semibold tracking-wide ${index === 0 ? 'active' : ''}`;
        btn.innerText = cat;

        btn.addEventListener("click", () => {
          const targetSection = document.getElementById(`section-${escapeId(cat)}`);
          if (targetSection) {
            const headerHeight = document.querySelector("header").offsetHeight;
            const targetPos = targetSection.getBoundingClientRect().top + window.pageYOffset - headerHeight - 12;
            window.scrollTo({ top: targetPos, behavior: "smooth" });
          }
        });

        tabsContainer.appendChild(btn);
      });

      // Group items by category
      const grouped = {};
      items.forEach(item => {
        const cat = item.Category ? item.Category.trim() : "Other";
        if (!grouped[cat]) grouped[cat] = [];
        grouped[cat].push(item);
      });

      // Render items container
      const menuContainer = document.getElementById("menuContainer");
      menuContainer.innerHTML = "";

      for (const [catName, dishList] of Object.entries(grouped)) {
        const section = document.createElement("section");
        section.id = `section-${escapeId(catName)}`;
        section.setAttribute("data-category-name", escapeId(catName));
        section.className = "category-section pt-4";

        // Category Title
        const header = document.createElement("div");
        header.className = "flex items-center justify-between pb-2 mb-2 border-b border-stone-200";
        header.innerHTML = `
          <h2 class="font-serif text-lg font-bold text-stone-900 tracking-tight">${catName}</h2>
          <span class="text-[11px] font-medium text-stone-400 bg-stone-100 px-2 py-0.5 rounded-full">${dishList.length} items</span>
        `;
        section.appendChild(header);

        // Dishes List
        const listWrapper = document.createElement("div");
        listWrapper.className = "divide-y divide-stone-100";

        dishList.forEach(dish => {
          const itemEl = document.createElement("div");
          itemEl.className = "py-3";

          // Top row: Name ........ Price
          const topRow = document.createElement("div");
          topRow.className = "flex items-baseline justify-between";

          // Dish name + optional badge
          const nameWrapper = document.createElement("div");
          nameWrapper.className = "flex items-center gap-1.5 flex-wrap";

          const nameHeading = document.createElement("h3");
          nameHeading.className = "text-[15px] font-semibold text-stone-900 leading-snug";
          nameHeading.innerText = dish.Name || "";
          nameWrapper.appendChild(nameHeading);

          if (dish.Badge && dish.Badge.trim() !== "") {
            const badgeSpan = document.createElement("span");
            badgeSpan.className = "text-[9px] uppercase font-bold tracking-wider px-1.5 py-0.5 rounded bg-amber-50 text-amber-800 border border-amber-200/60";
            badgeSpan.innerText = dish.Badge.trim();
            nameWrapper.appendChild(badgeSpan);
          }

          const dots = document.createElement("div");
          dots.className = "dish-dots hidden sm:block";

          const priceSpan = document.createElement("span");
          priceSpan.className = "text-[15px] font-bold text-stone-900 font-sans tracking-tight shrink-0 pl-2";
          priceSpan.innerText = `${CURRENCY_SYMBOL}${dish.Price || "0"}`;

          topRow.appendChild(nameWrapper);
          topRow.appendChild(dots);
          topRow.appendChild(priceSpan);
          itemEl.appendChild(topRow);

          // Subtitle / Description
          if (dish.Description && dish.Description.trim() !== "") {
            const descEl = document.createElement("p");
            descEl.className = "text-xs text-stone-500 mt-1 leading-relaxed pr-6";
            descEl.innerText = dish.Description.trim();
            itemEl.appendChild(descEl);
          }

          listWrapper.appendChild(itemEl);
        });

        section.appendChild(listWrapper);
        menuContainer.appendChild(section);
      }

      setupScrollSpy();
    }

    // ScrollSpy: Automatically highlights and centers the active category tab as the user scrolls
    function setupScrollSpy() {
      const sections = document.querySelectorAll(".category-section");
      const tabButtons = document.querySelectorAll(".cat-btn");
      const tabsContainer = document.getElementById("categoryTabs");

      let isScrollingTimer;
      window.addEventListener("scroll", () => {
        clearTimeout(isScrollingTimer);
        isScrollingTimer = setTimeout(() => {
          const headerHeight = document.querySelector("header").offsetHeight + 24;
          let currentCat = "";

          sections.forEach(section => {
            const rect = section.getBoundingClientRect();
            if (rect.top <= headerHeight) {
              currentCat = section.getAttribute("data-category-name");
            }
          });

          if (!currentCat && sections.length > 0) {
            currentCat = sections[0].getAttribute("data-category-name");
          }

          if (currentCat) {
            tabButtons.forEach(btn => {
              const isMatch = btn.getAttribute("data-cat") === currentCat;
              btn.classList.toggle("active", isMatch);

              if (isMatch) {
                // Ensure the active pill is visible in the scroll container
                const btnLeft = btn.offsetLeft;
                const btnWidth = btn.offsetWidth;
                const containerWidth = tabsContainer.offsetWidth;
                tabsContainer.scrollTo({
                  left: btnLeft - containerWidth / 2 + btnWidth / 2,
                  behavior: "smooth"
                });
              }
            });
          }
        }, 30);
      }, { passive: true });
    }

    // Start loading
    window.addEventListener("DOMContentLoaded", loadMenu);
  </script>
